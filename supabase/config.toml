# Reseller-IPN von CopeCart/Digistore24/elopage. Die Plattformen rufen ohne
# jedes Token auf — Echtheit wird in der Funktion per Signatur geprueft, nicht
# per JWT. Mit verify_jwt kaeme keine einzige Meldung an.
[functions.external-billing-webhook]
verify_jwt = false

# Ruft der Mailclient bzw. der Empfaenger ohne Login auf — der hat kein JWT.
